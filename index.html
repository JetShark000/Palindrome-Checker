<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palindrome Checker</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
  <header>
    <div class="header-container">
      <h1>Is it a Palindrome?</h1>
      <p>Check if your word or sentence reads the same both forward and backward.</p>
    </div>
  </header>

    <div class = "container">
    <input type="text" id ="text-input" placeholder="Enter something">
    <button id = "check-btn">Check</button>
    <div id ="result"></div>
    <div class ="description">
      <P>⭐ A palindrome is a word 
        or sentence that is spelled 
        the same way both forwards 
        and backwards, ignoring 
        punctuation, case and spacing.</p>
  </div>
  </div>

  <footer>
    <div class="footer-container">
      <p> Omar Sajjad, 2025.
    </div>
  </footer>

</body>
<script defer src="script.js"></script>
</html>
